x 6px rgba(0,0,0,0.35);\n            z-index: 2;\n        }\n        .sweep-controls {\n            display: flex;\n            justify-content: space-between;\n            gap: 12px;\n            margin-top: 14px;\n        }\n        .sweep-toggle-label {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            font-size: 0.95rem;\n            font-weight: 600;\n            min-height: 44px;\n        }\n\n        /* ---- Presets ---- */\n        .preset-row {\n            display: flex;\n            gap: 8px;\n            flex-wrap: wrap;\n            margin-bottom: 8px;\n        }\n        .preset-btn {\n            min-height: 44px;\n            padding: 8px 16px;\n            background: rgba(255,255,255,0.12);\n            border: 1.5px solid rgba(255,255,255,0.45);  /* contour visible 1.4.11 */\n            border-radius: 12px;\n            color: #fff;\n            font-size: 0.95rem;\n            font-weight: 600;\n            cursor: pointer;\n            user-select: none;\n            display: inline-flex;\n            align-items: center;\n            gap: 8px;\n        }\n        .preset-btn:active { background: rgba(255,255,255,0.28); }\n        .preset-del {\n            opacity: 0.85; font-size: 0.85em;\n            padding: 4px;\n        }\n        .preset-save-row {\n            display: flex;\n            gap: 10px;\n            margin-top: 10px;\n        }\n        .preset-name-input {\n            flex-grow: 1;\n            min-height: 44px;\n            padding: 8px 14px;\n            border-radius: 12px;\n            border: 1.5px solid rgba(255,255,255,0.5);\n            background: rgba(255,255,255,0.95);\n            color: var(--ink);\n            font-size: 16px;            /* ≥16px : évite le zoom auto iOS */\n            outline: none;\n        }\n        .preset-name-input::placeholder { color: #67757c; }\n        .btn-save-preset {\n            min-height: 44px;\n            padding: 8px 18px;\n            background: var(--go);\n            border: 1.5px solid #0d7a3e;\n            border-radius: 12px;\n            color: #fff;\n            font-size: 0.95rem;\n            font-weight: 700;\n            cursor: pointer;\n            white-space: nowrap;\n            display: inline-flex;\n            align-items: center;\n            gap: 6px;\n        }\n        .btn-save-preset:active { filter: brightness(0.92); }\n\n        /* ---- Sélecteur de sortie ---- */\n        .device-section label.field-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }\n        select {\n            width: 100%;\n            min-height: 44px;\n            padding: 8px 12px;\n            border-radius: 12px;\n            border: 1.5px solid rgba(255,255,255,0.5);\n            font-size: 16px;\n            background: rgba(255,255,255,0.95);\n            color: var(--ink);\n        }\n        .ios-msg { margin-top: 8px; font-size: 0.9rem; color: var(--on-brand); display: none; }\n\n        /* ---- Barre de transport fixe ---- */\n        .transport {\n            position: fixed;\n            bottom: 0; left: 0; right: 0;\n            z-index: 30;\n            display: flex;\n            gap: 10px;\n            padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);\n            padding-left: max(16px, env(safe-area-inset-left));\n            padding-right: max(16px, env(safe-area-inset-right));\n            background: var(--brand-deep);\n            border-top: 1px solid var(--line);\n            box-shadow: 0 -6px 20px rgba(0,0,0,0.35);\n        }\n        @media (min-width: 520px) {\n            .transport { left: 50%; transform: translateX(-50%); width: 520px; }\n        }\n        .btn-main {\n            flex: 1;\n            min-height: 60px;\n            border-radius: 14px;\n            font-size: 1.2rem;\n            font-weight: 700;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            gap: 10px;\n            cursor: pointer;\n            user-select: none;\n            touch-action: none;\n            -webkit-tap-highlight-color: transparent;\n            border: 2px solid transparent;\n        }\n        .btn-play {\n            background: var(--go);\n            color: #fff;\n            border-color: #0c8a48;\n        }\n        .btn-play.active {\n            background: var(--stop);\n            border-color: #a82a23;\n        }\n        .btn-hold {\n            background: rgba(255,255,255,0.14);\n            color: #fff;\n            border-color: rgba(255,255,255,0.5);\n        }\n        .btn-hold.active {\n            background: var(--hold);\n            border-color: #8c6708;\n            color: #fff;\n        }\n        .btn-main .icon { font-size: 1.1rem; }\n\n        /* ---- Focus visible (2.4.7 / 2.4.13) ---- */\n        button:focus-visible,\n        input:focus-visible,\n        select:focus-visible,\n        .ds-handle:focus-visible,\n        .preset-name-input:focus-visible {\n            outline: 3px solid var(--focus);\n            outline-offset: 2px;\n        }\n        .knob-slider:focus-visible,\n        .hs-range:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 6px; }\n\n        @media (prefers-reduced-motion: reduce) {\n            * { transition: none !important; }\n        }\n    <\u002Fstyle>\n<\u002Fhead>\n\n<body>\n<div class=\"app\">\n    <header class=\"app-header\">\n        <h1>Wave Generator<\u002Fh1>\n        <div class=\"header-vu\" aria-hidden=\"true\">\n            <span style=\"height:8px\"><\u002Fspan>\n            <span style=\"height:16px\"><\u002Fspan>\n            <span style=\"height:11px\"><\u002Fspan>\n            <span style=\"height:20px\"><\u002Fspan>\n            <span style=\"height:6px\"><\u002Fspan>\n        <\u002Fdiv>\n    <\u002Fheader>\n\n    <main class=\"scroller\">\n        <div class=\"vis-container\" aria-hidden=\"true\">\n            <canvas class=\"scope-canvas\" id=\"scopeCanvas\"><\u002Fcanvas>\n            <canvas class=\"vu-canvas\" id=\"vuCanvas\"><\u002Fcanvas>\n        <\u002Fdiv>\n\n        <section class=\"card\" aria-label=\"Réglages principaux\">\n            <div class=\"sliders-grid\" id=\"knobsGrid\"><\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel\">\n            <div class=\"sweep-header\">\n                <span class=\"section-title\" style=\"margin:0\">⟷ Freq Sweep<\u002Fspan>\n                <input type=\"checkbox\" class=\"toggle-ios\" id=\"sweepToggle\" aria-label=\"Activer le balayage de fréquence\">\n            <\u002Fdiv>\n            <div id=\"sweepBody\">\n                <div class=\"sweep-label\" id=\"sweepLabel\">50 Hz — 1200 Hz<\u002Fdiv>\n                <div class=\"dual-slider-wrap\" id=\"sweepSlider\">\n                    <div class=\"ds-track\"><\u002Fdiv>\n                    <div class=\"ds-fill\" id=\"sweepFill\"><\u002Fdiv>\n                    <div class=\"ds-handle\" id=\"sweepH1\" tabindex=\"0\" role=\"slider\" aria-label=\"Fréquence basse du balayage\"><\u002Fdiv>\n                    <div class=\"ds-handle\" id=\"sweepH2\" tabindex=\"0\" role=\"slider\" aria-label=\"Fréquence haute du balayage\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"sweep-controls\">\n                    <label class=\"sweep-toggle-label\">\n                        <input type=\"checkbox\" class=\"toggle-ios\" id=\"invertToggle\" aria-label=\"Inverser le balayage\">\n                        <span>⇄ Inverser<\u002Fspan>\n                    <\u002Flabel>\n                    <label class=\"sweep-toggle-label\">\n                        <input type=\"checkbox\" class=\"toggle-ios\" id=\"doubleToggle\" aria-label=\"Doubler le balayage\">\n                        <span>⋀ Double<\u002Fspan>\n                    <\u002Flabel>\n                <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"card\" aria-label=\"Réglages stéréo et détune\">\n            <div id=\"slidersWrap\"><\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel\">\n            <div class=\"section-title\">🎛 Préréglages<\u002Fdiv>\n            <div class=\"preset-row\" id=\"builtinPresets\"><\u002Fdiv>\n            <div class=\"preset-row\" id=\"userPresets\"><\u002Fdiv>\n            <div class=\"preset-save-row\">\n                <input type=\"text\" class=\"preset-name-input\" id=\"presetNameInput\" placeholder=\"Nom du préréglage…\" aria-label=\"Nom du préréglage\">\n                <button type=\"button\" class=\"btn-save-preset\" id=\"btnSavePreset\">💾 Sauver<\u002Fbutton>\n            <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"panel device-section\" id=\"deviceSection\">\n            <label class=\"field-label\" for=\"deviceSelect\">Sortie audio<\u002Flabel>\n            <select id=\"deviceSelect\">\n                <option value=\"\">Sélection par défaut<\u002Foption>\n            <\u002Fselect>\n        <\u002Fsection>\n        <p class=\"ios-msg\" id=\"iosDeviceMsg\">Le son est dirigé vers le périphérique iOS par défaut.<\u002Fp>\n    <\u002Fmain>\n<\u002Fdiv>\n\n<nav class=\"transport\" aria-label=\"Lecture\">\n    <button type=\"button\" class=\"btn-main btn-play\" id=\"btnPlay\" aria-pressed=\"false\">\n        <span class=\"icon\" aria-hidden=\"true\">▶<\u002Fspan><span>Play<\u002Fspan>\n    <\u002Fbutton>\n    <button type=\"button\" class=\"btn-main btn-hold\" id=\"btnHold\" aria-pressed=\"false\">\n        <span class=\"icon\" aria-hidden=\"true\">⏸<\u002Fspan><span>Hold<\u002Fspan>\n    <\u002Fbutton>\n<\u002Fnav>\n\n<script>\n// ============================================================\n//  Wave Generator — moteur audio + UI\n//  Logique audio inchangée. UI rendue avec de vrais <button>\n//  accessibles (libellés ARIA, focus clavier).\n// ============================================================\n\n// --- MATH UTILS ---\nfunction warpPhase(t, r) {\n    const r2 = r*r, r3 = r2*r;\n    if (t < r) {\n        const a1 = (2*r - 1) / r3;\n        const b1 = -3*(2*r - 1) / (2*r2);\n        return ((a1*t + b1)*t + 1)*t;\n    } else {\n        const u = (t - r) / (1 - r);\n        return (((1 - 2*r)*u + (6*r - 3)/2)*u + (1 - r))*u + 0.5;\n    }\n}\n\nfunction subOctaveHMax(fMain) {\n    const cutoff = 200;\n    const Sm = 1 / (1 + (fMain/cutoff)**2);\n    const Ss = 1 / (1 + ((fMain/2)/cutoff)**2);\n    const r = Sm / Ss;\n    return r / (1 + r);\n}\n\n// --- STATE ---\nconst STORAGE_KEY = 'stimgen_v10_wave_generator';\nconst USER_PRESETS_KEY = 'stimgen_v10_user_presets';\n\nconst defaultState = {\n    freq: 700, volume: 60, rythm: 0.5, depth: 0, emphasis: 0, ratio: 50,\n    sweepActive: false, sweepLo: 500, sweepHi: 900, invertSweep: false, doubleSweep: false,\n    balance: 0, phase: 0, detuneOffset: 0, detuneDepth: 0, subOctave: 0\n};\n\nlet state = Object.assign({}, defaultState);\n\nfunction loadState() {\n    try {\n        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');\n        Object.assign(state, s);\n    } catch(e) {}\n    state.sweepLo = Math.max(50, Math.min(1190, state.sweepLo || 500));\n    state.sweepHi = Math.max(state.sweepLo + 10, Math.min(1200, state.sweepHi || 900));\n    Object.keys(defaultState).forEach(k => {\n        if (state[k] === undefined) state[k] = defaultState[k];\n    });\n}\n\nfunction saveState() {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n}\n\nconst BUILTIN_PRESETS = [\n    { name: 'Défaut',    state: { freq:700,  volume:60, rythm:0.5,  depth:0,  ratio:50, balance:0, phase:0, detuneOffset:0,   detuneDepth:0,  subOctave:0,  sweepActive:false } },\n    { name: 'Delta',     state: { freq:200,  volume:60, rythm:2,    depth:80, ratio:50, balance:0, phase:0, detuneOffset:2,   detuneDepth:30, subOctave:0,  sweepActive:false } },\n    { name: 'Theta',     state: { freq:432,  volume:60, rythm:6,    depth:70, ratio:50, balance:0, phase:0, detuneOffset:6,   detuneDepth:20, subOctave:0,  sweepActive:false } },\n    { name: 'Alpha',     state: { freq:528,  volume:60, rythm:10,   depth:60, ratio:50, balance:0, phase:0, detuneOffset:10,  detuneDepth:20, subOctave:0,  sweepActive:false } },\n    { name: 'Sweep ♭',  state: { freq:200,  volume:60, rythm:0.2,  depth:40, ratio:50, balance:0, phase:0, detuneOffset:0,   detuneDepth:0,  subOctave:60, sweepActive:true, sweepLo:80, sweepHi:400 } },\n];\n\nfunction loadUserPresets() {\n    try { return JSON.parse(localStorage.getItem(USER_PRESETS_KEY) || '[]'); } catch(e) { return []; }\n}\nfunction saveUserPresets(list) { localStorage.setItem(USER_PRESETS_KEY, JSON.stringify(list)); }\n\nfunction applyPreset(ps) {\n    Object.assign(state, ps);\n    state.sweepLo = Math.max(50, Math.min(1190, state.sweepLo || 500));\n    state.sweepHi = Math.max(state.sweepLo + 10, Math.min(1200, state.sweepHi || 900));\n    Object.keys(defaultState).forEach(k => { if (state[k] === undefined) state[k] = defaultState[k]; });\n    saveState();\n    syncAllUI();\n    if (audioInit) { updateModBuffer(); updateAudioParams(); }\n}\n\n// --- AUDIO ---\nlet ctx = null, audioInit = false;\nlet merger, masterG, analyserL, analyserR, analyserDetune;\nlet carrierOsc, carrierMix1, carrierOscDetune, carrierMix2, carrierOscH2, harmonicGain;\nlet balL, balR, amGainL, amGainR, depthGainL, depthGainR, amGainDetune;\nlet modOsc, delayModL, delayModR, sweepShaper, sweepLFOGain, subSweepGain, detuneConstant;\n\nfunction initAudio() {\n    if (audioInit) return;\n    ctx = new (window.AudioContext || window.webkitAudioContext)();\n\n    merger = ctx.createChannelMerger(2);\n    masterG = ctx.createGain(); masterG.gain.value = 0;\n    merger.connect(masterG); masterG.connect(ctx.destination);\n\n    const monL = ctx.createGain(), monR = ctx.createGain();\n    masterG.connect(monL); masterG.connect(monR);\n\n    analyserL = ctx.createAnalyser(); analyserL.fftSize = 2048; monL.connect(analyserL);\n    analyserR = ctx.createAnalyser(); analyserR.fftSize = 2048; monR.connect(analyserR);\n    analyserDetune = ctx.createAnalyser(); analyserDetune.fftSize = 2048;\n\n    carrierOsc = ctx.createOscillator(); carrierMix1 = ctx.createGain();\n    carrierOsc.connect(carrierMix1);\n\n    carrierOscDetune = ctx.createOscillator(); carrierMix2 = ctx.createGain();\n    carrierOscDetune.connect(carrierMix2);\n\n    carrierOscH2 = ctx.createOscillator(); harmonicGain = ctx.createGain();\n    carrierOscH2.connect(harmonicGain);\n\n    const mainSum = ctx.createGain();\n    carrierMix1.connect(mainSum); carrierMix2.connect(mainSum); harmonicGain.connect(mainSum);\n\n    amGainL = ctx.createGain(); amGainR = ctx.createGain();\n    balL = ctx.createGain(); balR = ctx.createGain();\n    mainSum.connect(amGainL); amGainL.connect(balL); balL.connect(merger, 0, 0);\n    mainSum.connect(amGainR); amGainR.connect(balR); balR.connect(merger, 0, 1);\n\n    delayModL = ctx.createDelay(5.0); delayModR = ctx.createDelay(5.0);\n    depthGainL = ctx.createGain(); depthGainR = ctx.createGain();\n    delayModL.connect(depthGainL); delayModR.connect(depthGainR);\n    depthGainL.connect(amGainL.gain); depthGainR.connect(amGainR.gain);\n\n    amGainDetune = ctx.createGain(); amGainDetune.gain.value = 0;\n    carrierMix2.connect(amGainDetune); amGainDetune.connect(analyserDetune);\n    depthGainL.connect(amGainDetune.gain);\n\n    sweepShaper = ctx.createWaveShaper();\n    sweepLFOGain = ctx.createGain();\n    subSweepGain = ctx.createGain(); subSweepGain.gain.value = 0.5;\n    sweepShaper.connect(sweepLFOGain);\n    sweepLFOGain.connect(carrierOsc.frequency);\n    sweepLFOGain.connect(carrierOscDetune.frequency);\n    sweepLFOGain.connect(subSweepGain); subSweepGain.connect(carrierOscH2.frequency);\n\n    detuneConstant = ctx.createConstantSource();\n    detuneConstant.connect(carrierOscDetune.frequency);\n\n    carrierOsc.start(); carrierOscDetune.start(); carrierOscH2.start(); detuneConstant.start();\n\n    updateModBuffer();\n    updateAudioParams();\n    audioInit = true;\n}\n\nlet currentPhaseIntegrator = 0;\nfunction updateModBuffer() {\n    if (!ctx) return;\n    const size = ctx.sampleRate;\n    const buf = ctx.createBuffer(1, size, ctx.sampleRate);\n    const data = buf.getChannelData(0);\n    const ratio = state.ratio / 100;\n    for (let i = 0; i < size; i++) data[i] = Math.sin(2 * Math.PI * warpPhase(i/size, ratio));\n\n    const newOsc = ctx.createBufferSource();\n    newOsc.buffer = buf; newOsc.loop = true;\n    newOsc.playbackRate.value = state.hold ? 0 : state.rythm;\n    newOsc.connect(sweepShaper); newOsc.connect(delayModL); newOsc.connect(delayModR);\n\n    const now = ctx.currentTime;\n    newOsc.start(now, (currentPhaseIntegrator % 1.0) * buf.duration);\n    if (modOsc) { modOsc.stop(now); try { modOsc.disconnect(); } catch(e) {} }\n    modOsc = newOsc;\n}\n\nfunction updateAudioParams() {\n    if (!ctx) return;\n    const now = ctx.currentTime;\n\n    masterG.gain.setTargetAtTime(state.playing ? state.volume / 100 : 0, now, 0.05);\n    if (modOsc) modOsc.playbackRate.setTargetAtTime(state.hold ? 0 : state.rythm, now, 0.05);\n\n    const cf = state.sweepActive ? (state.sweepLo + state.sweepHi)/2 : state.freq;\n    carrierOsc.frequency.setTargetAtTime(cf, now, 0.05);\n    carrierOscH2.frequency.setTargetAtTime(cf/2, now, 0.05);\n    carrierOscDetune.frequency.setTargetAtTime(cf, now, 0.05);\n    detuneConstant.offset.setTargetAtTime(state.detuneOffset, now, 0.05);\n\n    const hRaw = state.subOctave / 100;\n    const h = cf < 100 ? 0 : hRaw * subOctaveHMax(cf);\n    const d = state.detuneDepth / 100;\n    carrierMix1.gain.setTargetAtTime((1-h)*(1-d/2), now, 0.05);\n    carrierMix2.gain.setTargetAtTime((1-h)*(d/2), now, 0.05);\n    harmonicGain.gain.setTargetAtTime(h, now, 0.05);\n\n    const depth = state.depth / 100;\n    const amBase = 1.0 - depth/2;\n    amGainL.gain.setTargetAtTime(amBase, now, 0.05);\n    amGainR.gain.setTargetAtTime(amBase, now, 0.05);\n    amGainDetune.gain.setTargetAtTime(amBase, now, 0.05);\n    depthGainL.gain.setTargetAtTime(depth/2, now, 0.05);\n    depthGainR.gain.setTargetAtTime(depth/2, now, 0.05);\n\n    balL.gain.setTargetAtTime(state.balance > 0 ? 1 - state.balance/100 : 1, now, 0.05);\n    balR.gain.setTargetAtTime(state.balance < 0 ? 1 + state.balance/100 : 1, now, 0.05);\n\n    let delaySecs = state.rythm > 0.01 ? (Math.abs(state.phase)/360) / state.rythm : 0;\n    delaySecs = Math.min(delaySecs, 5.0);\n    delayModL.delayTime.setTargetAtTime(state.phase < 0 ? delaySecs : 0, now, 0.05);\n    delayModR.delayTime.setTargetAtTime(state.phase > 0 ? delaySecs : 0, now, 0.05);\n\n    let sr = state.sweepActive ? (state.sweepHi - state.sweepLo)/2 : 0;\n    if (state.invertSweep) sr = -sr;\n    sweepLFOGain.gain.setTargetAtTime(sr, now, 0.05);\n\n    if (state.doubleSweep && state.sweepActive) {\n        const c = new Float32Array(2048);\n        for (let i = 0; i < 2048; i++) c[i] = 2 * Math.abs((i/2047)*2 - 1) - 1;\n        sweepShaper.curve = c;\n    } else {\n        const c = new Float32Array([-1, 1]);\n        sweepShaper.curve = c;\n    }\n}\n\n// --- KNOBS (grid sliders) ---\nconst knobsDef = [\n    { id:'freq',     label:'Fréquence', min:50,  max:1200, step:10,   color:'#0f6b7a', fmt: v => v+' Hz' },\n    { id:'volume',   label:'Volume',    min:0,   max:100,  step:1,    color:'#9c5e16', fmt: v => v+' %' },\n    { id:'rythm',    label:'Rythm',     min:0,   max:5,    step:0.05, color:'#245fa6', fmt: v => (+v).toFixed(2)+' Hz' },\n    { id:'depth',    label:'Depth',     min:0,   max:100,  step:1,    color:'#1f7a4d', fmt: v => v+' %' },\n    { id:'emphasis', label:'Emphasis',  min:0,   max:100,  step:1,    color:'#6d3f80', fmt: v => v+' %', disabled:true },\n    { id:'ratio',    label:'Ratio',     min:20,  max:80,   step:1,    color:'#a04335', fmt: v => v+'/'+(100-v) }\n];\nconst knobRefs = {};\n\nfunction holdRepeat(el, fn) {\n    let timer = null;\n    const go = (e) => { e.preventDefault(); fn(); timer = setTimeout(function tick(){ fn(); timer = setTimeout(tick, 80); }, 400); };\n    const stop = () => { clearTimeout(timer); timer = null; };\n    el.addEventListener('mousedown', go);\n    el.addEventListener('touchstart', go, { passive: false });\n    window.addEventListener('mouseup', stop);\n    window.addEventListener('touchend', stop);\n    // Accessibilité clavier : Entrée / Espace déclenchent un pas\n    el.addEventListener('keydown', (e) => {\n        if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space') { e.preventDefault(); fn(); }\n    });\n}\n\nfunction renderKnobs() {\n    const grid = document.getElementById('knobsGrid');\n    grid.innerHTML = '';\n    knobsDef.forEach(k => {\n        const wrap = document.createElement('div');\n        wrap.className = 'slider-wrap' + (k.disabled ? ' disabled-slider' : '');\n        wrap.id = 'wrap_' + k.id;\n\n        const hdr = document.createElement('div');\n        hdr.className = 'slider-header';\n\n        const lbl = document.createElement('label');\n        lbl.className = 'slider-label';\n        lbl.textContent = k.label;\n        lbl.setAttribute('for', 'knob_' + k.id);\n\n        const valEl = document.createElement('span');\n        valEl.className = 'slider-val';\n        valEl.id = 'val_' + k.id;\n\n        hdr.appendChild(lbl); hdr.appendChild(valEl);\n\n        const input = document.createElement('input');\n        input.type = 'range';\n        input.className = 'knob-slider';\n        input.id = 'knob_' + k.id;\n        input.min = k.min; input.max = k.max; input.step = k.step;\n        input.setAttribute('aria-label', k.label);\n        if (k.disabled) input.disabled = true;\n        const cur = (state[k.id] !== undefined) ? state[k.id] : k.min;\n        input.value = cur;\n        input.style.setProperty('--thumb-color', k.color);\n\n        const setTrack = (v) => {\n            const pct = Math.max(0, Math.min(100, ((v - k.min) / (k.max - k.min)) * 100));\n            input.style.setProperty('--fill-pct', pct + '%');\n        };\n        setTrack(cur);\n        valEl.textContent = k.fmt(cur);\n\n        input.addEventListener('input', () => {\n            if (k.id === 'freq' && state.sweepActive) return;\n            const v = Math.round(parseFloat(input.value) / k.step) * k.step;\n            state[k.id] = v;\n            setTrack(v); valEl.textContent = k.fmt(v);\n            if (k.id === 'ratio') updateModBuffer();\n            if (audioInit) updateAudioParams();\n            saveState(); updateHSDisplays();\n        });\n\n        const btnRow = document.createElement('div');\n        btnRow.className = 'knob-btn-row';\n        const btnM = document.createElement('button'); btnM.type = 'button'; btnM.className = 'knob-btn'; btnM.textContent = '−';\n        btnM.setAttribute('aria-label', 'Diminuer ' + k.label);\n        const btnP = document.createElement('button'); btnP.type = 'button'; btnP.className = 'knob-btn'; btnP.textContent = '+';\n        btnP.setAttribute('aria-label', 'Augmenter ' + k.label);\n        if (k.disabled) { btnM.disabled = true; btnP.disabled = true; }\n\n        const updateKnob = (nv) => {\n            if (k.id === 'freq' && state.sweepActive) return;\n            nv = Math.round(Math.max(k.min, Math.min(k.max, nv)) / k.step) * k.step;\n            state[k.id] = nv;\n            input.value = nv;\n            setTrack(nv); valEl.textContent = k.fmt(nv);\n            if (k.id === 'ratio') updateModBuffer();\n            if (audioInit) updateAudioParams();\n            saveState(); updateHSDisplays();\n        };\n        holdRepeat(btnM, () => updateKnob(state[k.id] - k.step));\n        holdRepeat(btnP, () => updateKnob(state[k.id] + k.step));\n\n        btnRow.appendChild(btnM); btnRow.appendChild(btnP);\n        wrap.appendChild(hdr); wrap.appendChild(input); wrap.appendChild(btnRow);\n        grid.appendChild(wrap);\n        knobRefs[k.id] = { input, valEl, def: k, setTrack };\n    });\n}\n\nfunction syncKnob(id, overrideVal) {\n    const r = knobRefs[id];\n    if (!r) return;\n    const v = overrideVal !== undefined ? overrideVal : state[id];\n    r.valEl.textContent = r.def.fmt(v);\n    r.input.value = v;\n    r.setTrack(v);\n}\n\n// --- HORIZONTAL SLIDERS ---\nconst hsDef = [\n    { id:'balance',      label:'Balance',            min:-100, max:100,  step:1   },\n    { id:'phase',        label:'Déphasage L/R',      min:-45,  max:45,   step:1   },\n    { id:'detuneOffset', label:'Détune Offset',      min:-2.5, max:2.5,  step:0.1 },\n    { id:'detuneDepth',  label:'Profondeur Détune',  min:0,    max:100,  step:1   },\n    { id:'subOctave',    label:'Sous-octave (Bass)', min:0,    max:100,  step:1   }\n];\nconst hsRefs = {};\n\nfunction fmtHS(id, v) {\n    v = +v;\n    if (id === 'balance')      return v === 0 ? 'Centre' : (v < 0 ? `◀ L ${-v}` : `R ${v} ▶`);\n    if (id === 'phase')        return v === 0 ? 'Synchro' : (v > 0 ? `L mène ${v}°` : `R mène ${-v}°`);\n    if (id === 'detuneOffset') return v === 0 ? 'Synchro' : `${v>0?'+':''}${v.toFixed(1)} Hz`;\n    if (id === 'detuneDepth')  return v + ' %';\n    if (id === 'subOctave') {\n        const cf = state.sweepActive ? (state.sweepLo+state.sweepHi)/2 : state.freq;\n        return cf < 100 ? '(muet)' : `${v} % (${(cf/2).toFixed(0)} Hz)`;\n    }\n    return v;\n}\n\nfunction renderSliders() {\n    const wrap = document.getElementById('slidersWrap');\n    wrap.innerHTML = '';\n    hsDef.forEach(s => {\n        const row = document.createElement('div');\n        row.className = 'hs-row';\n\n        const lblRow = document.createElement('div');\n        lblRow.className = 'hs-label-row';\n        const lbl = document.createElement('label'); lbl.textContent = s.label; lbl.setAttribute('for', 'hs_' + s.id);\n        const valEl = document.createElement('span'); valEl.className = 'hs-val'; valEl.id = 'hsval_' + s.id;\n        lblRow.appendChild(lbl); lblRow.appendChild(valEl);\n\n        const cw = document.createElement('div'); cw.className = 'horiz-slider-wrap';\n        const btnM = document.createElement('button'); btnM.type = 'button'; btnM.className = 'hs-btn'; btnM.textContent = '−';\n        btnM.setAttribute('aria-label', 'Diminuer ' + s.label);\n        const btnP = document.createElement('button'); btnP.type = 'button'; btnP.className = 'hs-btn'; btnP.textContent = '+';\n        btnP.setAttribute('aria-label', 'Augmenter ' + s.label);\n        const range = document.createElement('input'); range.type = 'range';\n        range.className = 'hs-range';\n        range.id = 'hs_' + s.id;\n        range.setAttribute('aria-label', s.label);\n        range.min = s.min; range.max = s.max; range.step = s.step;\n        const cur = (state[s.id] !== undefined) ? state[s.id] : 0;\n        range.value = cur;\n        valEl.textContent = fmtHS(s.id, cur);\n\n        const setHSTrack = (v) => {\n            const pct = Math.max(0, Math.min(100, ((v - s.min) / (s.max - s.min)) * 100));\n            range.style.setProperty('--hs-fill', pct + '%');\n        };\n        setHSTrack(cur);\n\n        cw.appendChild(btnM); cw.appendChild(range); cw.appendChild(btnP);\n        row.appendChild(lblRow); row.appendChild(cw);\n        wrap.appendChild(row);\n\n        const update = (nv) => {\n            nv = Math.round(Math.max(s.min, Math.min(s.max, nv)) / s.step) * s.step;\n            state[s.id] = nv;\n            range.value = nv;\n            valEl.textContent = fmtHS(s.id, nv);\n            setHSTrack(nv);\n            if (audioInit) updateAudioParams();\n            saveState();\n        };\n        range.addEventListener('input', e => update(parseFloat(e.target.value)));\n        holdRepeat(btnM, () => update(state[s.id] - s.step));\n        holdRepeat(btnP, () => update(state[s.id] + s.step));\n\n        hsRefs[s.id] = { range, valEl };\n    });\n}\n\nfunction updateHSDisplays() {\n    hsDef.forEach(s => {\n        const el = document.getElementById('hsval_' + s.id);\n        if (el) el.textContent = fmtHS(s.id, state[s.id]);\n    });\n}\n\nfunction syncAllUI() {\n    renderKnobs();\n    renderSliders();\n    updateSweepUI();\n    document.getElementById('invertToggle').checked = !!state.invertSweep;\n    document.getElementById('doubleToggle').checked = !!state.doubleSweep;\n}\n\n// --- SWEEP ---\nlet sWrap, sFill, sH1, sH2, sBody;\n\nfunction updateSweepUI() {\n    const minF = 50, maxF = 1200;\n    const w = sWrap.offsetWidth - 24;\n    const p1 = (state.sweepLo - minF) / (maxF - minF);\n    const p2 = (state.sweepHi - minF) / (maxF - minF);\n    sH1.style.left = `calc(12px + ${p1*w}px)`;\n    sH2.style.left = `calc(12px + ${p2*w}px)`;\n    sFill.style.left = `calc(12px + ${p1*w}px)`;\n    sFill.style.width = `${(p2-p1)*w}px`;\n    document.getElementById('sweepLabel').textContent = `${state.sweepLo} Hz — ${state.sweepHi} Hz`;\n    sBody.style.opacity = state.sweepActive ? '1' : '0.5';\n    sBody.style.pointerEvents = state.sweepActive ? 'auto' : 'none';\n    document.getElementById('sweepToggle').checked = state.sweepActive;\n    const fw = document.getElementById('wrap_freq');\n    if (fw) {\n        fw.classList.toggle('knob-sweep-active', state.sweepActive);\n        if (!state.sweepActive) syncKnob('freq');\n    }\n}\n\nfunction bindSweep() {\n    let drag = null, sx, sLo, sHi;\n    const onStart = (type, e) => {\n        drag = type; sx = e.touches ? e.touches[0].clientX : e.clientX;\n        sLo = state.sweepLo; sHi = state.sweepHi;\n        e.preventDefault();\n    };\n    const onMove = (e) => {\n        if (!drag) return;\n        const x = e.touches ? e.touches[0].clientX : e.clientX;\n        const w = sWrap.offsetWidth - 24;\n        const df = Math.round(((x - sx) / w) * 1150 / 10) * 10;\n        if (drag === 'h1')   state.sweepLo = Math.max(50, Math.min(state.sweepHi-10, sLo+df));\n        else if (drag === 'h2') state.sweepHi = Math.max(state.sweepLo+10, Math.min(1200, sHi+df));\n        else if (drag === 'fill') {\n            const span = sHi - sLo;\n            let lo = sLo+df, hi = sHi+df;\n            if (lo < 50) { lo=50; hi=lo+span; }\n            if (hi > 1200) { hi=1200; lo=hi-span; }\n            state.sweepLo=lo; state.sweepHi=hi;\n        }\n        updateSweepUI(); if (audioInit) updateAudioParams(); updateHSDisplays();\n    };\n    const onEnd = () => { if (drag) { drag=null; saveState(); } };\n\n    ['mousedown','touchstart'].forEach(ev => {\n        const opts = ev === 'touchstart' ? {passive:false} : {};\n        sH1.addEventListener(ev, e => onStart('h1',e), opts);\n        sH2.addEventListener(ev, e => onStart('h2',e), opts);\n        sFill.addEventListener(ev, e => onStart('fill',e), opts);\n    });\n    window.addEventListener('mousemove', onMove, {passive:false});\n    window.addEventListener('touchmove', onMove, {passive:false});\n    window.addEventListener('mouseup', onEnd);\n    window.addEventListener('touchend', onEnd);\n\n    // Accessibilité clavier des poignées de sweep\n    const kbHandle = (which) => (e) => {\n        const stepKeys = { ArrowLeft:-10, ArrowDown:-10, ArrowRight:10, ArrowUp:10 };\n        if (!(e.key in stepKeys)) return;\n        e.preventDefault();\n        const d = stepKeys[e.key];\n        if (which === 'h1') state.sweepLo = Math.max(50, Math.min(state.sweepHi-10, state.sweepLo + d));\n        else state.sweepHi = Math.max(state.sweepLo+10, Math.min(1200, state.sweepHi + d));\n        updateSweepUI(); if (audioInit) updateAudioParams(); updateHSDisplays(); saveState();\n    };\n    sH1.addEventListener('keydown', kbHandle('h1'));\n    sH2.addEventListener('keydown', kbHandle('h2'));\n\n    document.getElementById('sweepToggle').addEventListener('change', e => {\n        state.sweepActive = e.target.checked;\n        updateSweepUI(); if (audioInit) updateAudioParams(); updateHSDisplays(); saveState();\n    });\n    document.getElementById('invertToggle').addEventListener('change', e => {\n        state.invertSweep = e.target.checked; if (audioInit) updateAudioParams(); saveState();\n    });\n    document.getElementById('doubleToggle').addEventListener('change', e => {\n        state.doubleSweep = e.target.checked; if (audioInit) updateAudioParams(); saveState();\n    });\n}\n\n// --- PRESETS ---\nfunction renderPresets() {\n    const bi = document.getElementById('builtinPresets');\n    bi.innerHTML = '';\n    BUILTIN_PRESETS.forEach(p => {\n        const b = document.createElement('button'); b.type = 'button'; b.className = 'preset-btn'; b.textContent = p.name;\n        b.addEventListener('click', () => applyPreset(p.state));\n        bi.appendChild(b);\n    });\n    renderUserPresets();\n}\n\nfunction renderUserPresets() {\n    const row = document.getElementById('userPresets');\n    row.innerHTML = '';\n    loadUserPresets().forEach((p, i) => {\n        const b = document.createElement('button'); b.type = 'button'; b.className = 'preset-btn preset-user';\n        b.appendChild(document.createTextNode(p.name + ' '));\n        const x = document.createElement('span');\n        x.className = 'preset-del';\n        x.textContent = '✕';\n        x.dataset.idx = i;\n        x.setAttribute('role', 'button');\n        x.setAttribute('aria-label', 'Supprimer le préréglage ' + p.name);\n        b.appendChild(x);\n        b.addEventListener('click', e => {\n            if (e.target.dataset.idx !== undefined) {\n                const list = loadUserPresets(); list.splice(+e.target.dataset.idx, 1);\n                saveUserPresets(list); renderUserPresets();\n            } else { applyPreset(p.state); }\n        });\n        row.appendChild(b);\n    });\n}\n\n// --- VISUALIZERS ---\nlet scopeCanvas, vuCanvas, sCtx, vCtx;\nconst bufL = new Float32Array(2048), bufR = new Float32Array(2048), bufD = new Float32Array(2048);\nlet dpr = 1;\n\nfunction initCanvas() {\n    dpr = window.devicePixelRatio || 1;\n    const w1 = scopeCanvas.offsetWidth || 280;\n    const w2 = vuCanvas.offsetWidth || 30;\n    const hh = scopeCanvas.offsetHeight || 96;\n    scopeCanvas.width = w1 * dpr; scopeCanvas.height = hh * dpr;\n    vuCanvas.width = w2 * dpr;   vuCanvas.height = hh * dpr;\n    sCtx.setTransform(1,0,0,1,0,0); vCtx.setTransform(1,0,0,1,0,0);\n    sCtx.scale(dpr, dpr); vCtx.scale(dpr, dpr);\n}\n\nfunction drawScope() {\n    const w = scopeCanvas.offsetWidth || 280, h = scopeCanvas.offsetHeight || 96;\n    sCtx.fillStyle = '#0a151a';\n    sCtx.fillRect(0, 0, w, h);\n    sCtx.strokeStyle = 'rgba(255,255,255,0.08)';\n    sCtx.lineWidth = 1;\n    sCtx.beginPath();\n    for (let x = 0; x < w; x += 28) { sCtx.moveTo(x,0); sCtx.lineTo(x,h); }\n    for (let y = 0; y < h; y += 28) { sCtx.moveTo(0,y); sCtx.lineTo(w,y); }\n    sCtx.stroke();\n\n    if (!ctx || !state.playing) return;\n    analyserL.getFloatTimeDomainData(bufL);\n    analyserR.getFloatTimeDomainData(bufR);\n\n    const trace = (buf, color, lw) => {\n        sCtx.beginPath(); sCtx.strokeStyle = color; sCtx.lineWidth = lw;\n        for (let i = 0; i < buf.length; i += 4) {\n            const x = (i/buf.length)*w, y = (0.5 - buf[i]*0.5)*h;\n            i === 0 ? sCtx.moveTo(x,y) : sCtx.lineTo(x,y);\n        }\n        sCtx.stroke();\n    };\n\n    if (state.detuneDepth > 0) {\n        analyserDetune.getFloatTimeDomainData(bufD);\n        const cf2 = state.sweepActive ? (state.sweepLo+state.sweepHi)/2 : state.freq;\n        const h2 = cf2 < 100 ? 0 : (state.subOctave/100) * subOctaveHMax(cf2);\n        const sc = (1-h2)*(state.detuneDepth/100/2)*(state.volume/100);\n        for (let i = 0; i < bufD.length; i++) bufD[i] *= sc;\n        trace(bufD, 'rgba(240,150,60,0.8)', 1.5);\n    }\n    trace(bufL, '#3b86d6', 2.5);\n    trace(bufR, '#ff5c69', 2.5);\n\n    let pkL = 0, pkR = 0;\n    for (let i = 0; i < bufL.length; i++) {\n        if (Math.abs(bufL[i]) > pkL) pkL = Math.abs(bufL[i]);\n        if (Math.abs(bufR[i]) > pkR) pkR = Math.abs(bufR[i]);\n    }\n    const vw = vuCanvas.offsetWidth || 30;\n    vCtx.clearRect(0,0,vw,h);\n    vCtx.fillStyle = '#3b86d6'; vCtx.fillRect(2, h-pkL*h, vw/2-3, pkL*h);\n    vCtx.fillStyle = '#ff5c69'; vCtx.fillRect(vw/2+1, h-pkR*h, vw/2-3, pkR*h);\n}\n\nlet lastTime = performance.now();\nfunction animate() {\n    const now = performance.now();\n    const dt = (now - lastTime) / 1000;\n    lastTime = now;\n\n    if (state.playing && !state.hold) {\n        currentPhaseIntegrator = (currentPhaseIntegrator + dt * state.rythm) % 1.0;\n    }\n\n    if (state.sweepActive && state.playing && !state.hold) {\n        let lfo = Math.sin(2*Math.PI*warpPhase(currentPhaseIntegrator, state.ratio/100));\n        if (state.doubleSweep) lfo = 2*Math.abs(lfo)-1;\n        if (state.invertSweep) lfo = -lfo;\n        const instFreq = (state.sweepLo+state.sweepHi)/2 + (state.sweepHi-state.sweepLo)/2*lfo;\n        const r = knobRefs['freq'];\n        if (r) r.valEl.textContent = r.def.fmt(Math.round(instFreq));\n    }\n\n    drawScope();\n    requestAnimationFrame(animate);\n}\n\n// --- PLAY / HOLD ---\nfunction togglePlay() {\n    state.playing = !state.playing;\n    const btn = document.getElementById('btnPlay');\n    if (state.playing) {\n        btn.classList.add('active');\n        btn.setAttribute('aria-pressed', 'true');\n        btn.innerHTML = '<span class=\"icon\" aria-hidden=\"true\">■<\u002Fspan><span>Stop<\u002Fspan>';\n    } else {\n        btn.classList.remove('active');\n        btn.setAttribute('aria-pressed', 'false');\n        btn.innerHTML = '<span class=\"icon\" aria-hidden=\"true\">▶<\u002Fspan><span>Play<\u002Fspan>';\n    }\n    if (audioInit) updateAudioParams();\n}\n\n// --- DEVICE SELECTOR ---\nfunction setupDevices() {\n    const sel = document.getElementById('deviceSelect');\n    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||\n                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);\n    if (isIOS) {\n        const ds = document.getElementById('deviceSection');\n        if (ds) ds.style.display = 'none';\n        document.getElementById('iosDeviceMsg').style.display = 'block';\n    } else {\n        navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ audio: true }).then(() => {\n            navigator.mediaDevices.enumerateDevices().then(devices => {\n                devices.filter(d => d.kind === 'audiooutput').forEach((d, i) => {\n                    const o = document.createElement('option');\n                    o.value = d.deviceId; o.text = d.label || `Speaker ${i+1}`;\n                    sel.appendChild(o);\n                });\n            });\n        }).catch(() => {});\n        sel.addEventListener('change', e => {\n            if (ctx && typeof ctx.setSinkId === 'function') ctx.setSinkId(e.target.value).catch(console.error);\n        });\n    }\n}\n\n// --- BOOT ---\nwindow.addEventListener('load', () => {\n    sWrap = document.getElementById('sweepSlider');\n    sFill = document.getElementById('sweepFill');\n    sH1   = document.getElementById('sweepH1');\n    sH2   = document.getElementById('sweepH2');\n    sBody = document.getElementById('sweepBody');\n    scopeCanvas = document.getElementById('scopeCanvas');\n    vuCanvas    = document.getElementById('vuCanvas');\n    sCtx = scopeCanvas.getContext('2d');\n    vCtx = vuCanvas.getContext('2d');\n\n    loadState();\n    renderKnobs();\n    renderSliders();\n    bindSweep();\n    renderPresets();\n\n    document.getElementById('btnPlay').addEventListener('click', () => {\n        if (!audioInit) initAudio();\n        if (ctx.state === 'suspended') ctx.resume().then(togglePlay);\n        else togglePlay();\n    });\n    document.getElementById('btnHold').addEventListener('click', () => {\n        state.hold = !state.hold;\n        const hb = document.getElementById('btnHold');\n        hb.classList.toggle('active', state.hold);\n        hb.setAttribute('aria-pressed', state.hold ? 'true' : 'false');\n        if (audioInit) updateAudioParams();\n    });\n    document.addEventListener('keydown', e => {\n        if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;\n        if (e.code === 'Space' && (e.target === document.body)) { e.preventDefault(); document.getElementById('btnPlay').click(); }\n        else if (e.key === 'h' || e.key === 'H') document.getElementById('btnHold').click();\n    });\n\n    document.getElementById('btnSavePreset').addEventListener('click', () => {\n        const name = document.getElementById('presetNameInput').value.trim();\n        if (!name) return;\n        const list = loadUserPresets();\n        const ps = Object.assign({}, state);\n        list.push({ name, state: ps });\n        saveUserPresets(list);\n        document.getElementById('presetNameInput').value = '';\n        renderUserPresets();\n    });\n\n    document.getElementById('invertToggle').checked = !!state.invertSweep;\n    document.getElementById('doubleToggle').checked = !!state.doubleSweep;\n    setupDevices();\n\n    function waitForLayout(attempts) {\n        initCanvas();\n        updateSweepUI();\n        if (sWrap.offsetWidth < 10 && attempts > 0) {\n            setTimeout(() => waitForLayout(attempts - 1), 50);\n        }\n    }\n    requestAnimationFrame(() => waitForLayout(10));\n    requestAnimationFrame(animate);\n    window.addEventListener('resize', () => { initCanvas(); updateSweepUI(); });\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
